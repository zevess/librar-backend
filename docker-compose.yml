services:
  librar-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: librar-api
    container_name: librar-api-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    env_file:
      - .env.production
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: librar-api-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel

  # db:
  #   image: postgres:16-alpine
  #   container_name: laravel-postgres
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_DB: ${DB_DATABASE}
  #     POSTGRES_USER: ${DB_USERNAME}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - laravel
  scheduler:
    image: librar-api
    container_name: librar-api-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www 
    env_file:
      - .env.production
    command: php artisan schedule:work
    networks:
      - laravel
    depends_on:
      - librar-api

networks:
  laravel:
    driver: bridge
